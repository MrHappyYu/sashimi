server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sashimi_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.sashimi: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: sashimi-jwt-secret-key-2024-very-long-string-for-security
  expiration: 604800000  # 7天，单位ms

wx:
  # ========== 微信小程序配置 (需自行配置) ==========
  app-id: YOUR_WX_APP_ID       # 微信小程序 AppID
  app-secret: YOUR_WX_APP_SECRET  # 微信小程序 AppSecret
  # ================================================

  # 微信支付配置 (可选，如需支付功能)
  pay:
    mch-id: YOUR_MCH_ID          # 微信商户号
    mch-key: YOUR_MCH_KEY        # 微信支付API密钥
    notify-url: https://your-domain.com/api/order/pay-notify

app:
  # 餐厅预订时间段配置 (逗号分隔)
  reservation:
    time-slots: "11:00,11:30,12:00,12:30,13:00,17:00,17:30,18:00,18:30,19:00,19:30,20:00"
    max-people-per-slot: 20  # 每个时间段最大人数
